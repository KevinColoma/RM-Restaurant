# =============================================================================
# CI - Pipeline de Integración Continua (ramas dev y test)
# =============================================================================
# Este pipeline se ejecuta al hacer push o PR a dev/test.
# Flujo: lint → tests → CodeQL → sync a test / auto-merge a main + deploy Render
# =============================================================================

name: CI

# ── Disparadores ──────────────────────────────────────────────────────────────
on:
  push:
    branches: [dev, test]
  pull_request:
    branches: [dev, test]
  workflow_dispatch:          # Permite ejecución manual desde GitHub

# ── Shell ────────────────────────────────────────────────────────────────────
# Sin esto los pasos usan "bash -e", que NO activa pipefail: en
# "npm test | tee log" el exit code es el de tee (siempre 0), asi que un test
# fallando daba el paso por bueno y el pipeline seguia hasta desplegar.
# Declarar shell: bash hace que GitHub use "bash --noprofile --norc -eo pipefail",
# de modo que el fallo real del comando sea el que corta el pipeline.
defaults:
  run:
    shell: bash

# ── Variables de entorno globales ────────────────────────────────────────────
env:
  TELEGRAM_PREFIX: |          # Prefijo reutilizado en todas las notificaciones
    🏷 *${{ github.repository }}*
    🌿 Rama: \`${{ github.ref_name }}\`
    📝 \`${{ github.event.head_commit.message || 'N/A' }}\`
    👤 Autor: ${{ github.actor }}
    🔗 [Ver commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

jobs:
  # ── Job 1: Lint (ESLint backend + frontend) ──────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npx eslint . 2>&1 | tee lint-backend.log
      - run: cd frontend && npm ci
      - run: cd frontend && npx eslint src/ 2>&1 | tee lint-frontend.log
      # Sube los logs de lint aunque un paso anterior haya fallado, para que
      # el job final de resultados siempre tenga algo que empaquetar.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-logs
          path: |
            backend/lint-backend.log
            frontend/lint-frontend.log
          if-no-files-found: ignore
      # Notifica por Telegram que el lint pasó
      - name: Notify lint result
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ env.TELEGRAM_PREFIX }}
            ─────────────────────
            ✅ *Lint completado*
            📁 backend: `eslint .`
            📁 frontend: `eslint src/`
            Sin errores de lint.
            📌 Siguiente: Tests backend + frontend + CodeQL

  # ── Job 2: Tests Backend (Jest + Supertest + mongodb-memory-server) ──────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd backend && npm ci
      - run: cd backend && npm test -- --coverage 2>&1 | tee test-backend.log
      # Guarda reporte de cobertura + log como artefacto para SonarCloud y para
      # el job de resultados consolidados. if: always() para que quede
      # disponible incluso si "npm test" falló (con pipefail, un test roto
      # corta el job antes de este paso salvo que se le diga explícitamente
      # que corra siempre).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-backend
          path: |
            backend/coverage/
            backend/test-backend.log
          if-no-files-found: ignore
      - name: Notify backend test result
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ env.TELEGRAM_PREFIX }}
            ─────────────────────
            ✅ *Tests Backend OK*
            📦 Suites: `{{ steps.test-results.outputs.suites }}`
            📊 Cobertura global
            📌 Siguiente: Frontend tests + CodeQL

  # ── Job 3: Tests Frontend (Vitest + jsdom) ───────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci
      - run: cd frontend && npm test 2>&1 | tee test-frontend.log
      # Guarda reporte de cobertura + log como artefacto para SonarCloud y para
      # el job de resultados consolidados (if: always(), ver nota en test-backend).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: |
            frontend/coverage/
            frontend/test-frontend.log
          if-no-files-found: ignore
      - name: Notify frontend test result
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ env.TELEGRAM_PREFIX }}
            ─────────────────────
            ✅ *Tests Frontend OK*
            📦 Tests: todos pasaron
            📌 Siguiente: CodeQL y SonarCloud (solo en test)

  # ── Job 4: SonarCloud (solo en rama test) ────────────────────────────────
  sonarcloud:
    if: github.ref_name == 'test'       # Solo se ejecuta en test
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Descarga los artefactos de cobertura generados en jobs anteriores
      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/
      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
      # Corrige rutas en lcov.info para que SonarCloud las interprete correctamente
      - name: Fix lcov paths for SonarCloud
        run: |
          sed -i 's|^SF:|SF:backend/|' backend/coverage/lcov.info
          sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info
      - uses: sonarsource/sonarcloud-github-action@master
        with:
          qualityGateWait: true          # Espera a que el Quality Gate pase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Consulta métricas de SonarCloud vía API para incluirlas en la notificación
      - name: Fetch SonarCloud metrics
        id: sonar-metrics
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/measures/component?component=KevinColoma_RM-Restaurant&metricKeys=alert_status,coverage,bugs,code_smells,vulnerabilities,security_hotspots" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          measures = {m['metric']: m['value'] for m in d.get('component',{}).get('measures',[])}
          qg = '✅ Passed' if measures.get('alert_status') == 'OK' else '❌ Failed'
          print(f'SONAR_QG={qg}')
          print(f'SONAR_COV={measures.get(\"coverage\",\"N/A\")}%')
          print(f'SONAR_BUGS={measures.get(\"bugs\",\"?\")}')
          print(f'SONAR_SMELLS={measures.get(\"code_smells\",\"?\")}')
          print(f'SONAR_VULNS={measures.get(\"vulnerabilities\",\"?\")}')
          print(f'SONAR_HOTSPOTS={measures.get(\"security_hotspots\",\"?\")}')
          " >> $GITHUB_ENV
      - name: Notify SonarCloud result
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ env.TELEGRAM_PREFIX }}
            ─────────────────────
            ${{ env.SONAR_QG }}
            📈 Coverage: ${{ env.SONAR_COV }}
            🐛 Bugs: ${{ env.SONAR_BUGS }}
            💨 Code Smells: ${{ env.SONAR_SMELLS }}
            🔒 Vulnerabilities: ${{ env.SONAR_VULNS }}
            ⚡ Hotspots: ${{ env.SONAR_HOTSPOTS }}
            ─────────────────────
            🔗 [Ver reporte en SonarCloud](https://sonarcloud.io/project/overview?id=KevinColoma_RM-Restaurant)
            📌 Siguiente: Auto-merge a main + Deploy

  # ── Job 5: CodeQL (GitHub Security Analysis) ─────────────────────────────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
      - name: Notify CodeQL result
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ env.TELEGRAM_PREFIX }}
            ─────────────────────
            ✅ *CodeQL completado*
            🔒 Análisis de seguridad: sin vulnerabilidades críticas
            📌 Siguiente: ${{ github.ref_name == 'dev' && 'Sync a test' || 'Auto-merge a main + Deploy' }}

  # ── Job 5.5: Resultados consolidados en un solo archivo descargable ──────
  # Corre siempre (if: always()), sin importar si lint/tests/CodeQL fallaron,
  # para que siempre haya un artefacto único con todo lo ocurrido en este run:
  # logs de lint, logs de tests, cobertura y un resumen legible. Se descarga
  # desde la sección "Artifacts" al final de la página del run en GitHub
  # Actions (Summary), disponible apenas termina este job - no hace falta
  # esperar a que el pipeline completo pase.
  test-results:
    if: always()
    needs: [lint, test-backend, test-frontend, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lint-logs
          path: results/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-backend
          path: results/backend/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-frontend
          path: results/frontend/
      - name: Build summary
        run: |
          mkdir -p results
          {
            echo "# Resultados de CI — ${{ github.repository }}"
            echo ""
            echo "- Rama: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Fecha: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "## Estado por job"
            echo ""
            echo "| Job | Resultado |"
            echo "|---|---|"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Tests Backend | ${{ needs.test-backend.result }} |"
            echo "| Tests Frontend | ${{ needs.test-frontend.result }} |"
            echo "| CodeQL | ${{ needs.codeql.result }} |"
            echo ""
            echo "## Resumen de tests"
            echo ""
            echo "### Backend"
            echo '```'
            grep -E "Tests:|Test Suites:|Suites de prueba|✕|failed" results/backend/test-backend.log 2>/dev/null || echo "(log no disponible)"
            echo '```'
            echo ""
            echo "### Frontend"
            echo '```'
            grep -E "Test Files|Tests |FAIL" results/frontend/test-frontend.log 2>/dev/null || echo "(log no disponible)"
            echo '```'
            echo ""
            echo "## Resumen de lint"
            echo ""
            echo "### Backend"
            echo '```'
            tail -5 results/backend/lint-backend.log 2>/dev/null || echo "(log no disponible)"
            echo '```'
            echo ""
            echo "### Frontend"
            echo '```'
            tail -5 results/frontend/lint-frontend.log 2>/dev/null || echo "(log no disponible)"
            echo '```'
            echo ""
            echo "## Contenido de este archivo"
            echo ""
            echo "- SUMMARY.md (este archivo)"
            echo "- backend/lint-backend.log, backend/test-backend.log, backend/coverage/ (lcov.info, test-report.xml, html)"
            echo "- frontend/lint-frontend.log, frontend/test-frontend.log, frontend/coverage/ (lcov.info, test-report.xml, html)"
          } > results/SUMMARY.md
          cat results/SUMMARY.md
      - name: Upload single consolidated artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-results
          path: results/
          if-no-files-found: warn

  # ── Job 6: Sync dev → test ───────────────────────────────────────────────
  sync-to-test:
    if: success() && github.ref_name == 'dev'   # Solo en dev y si todo OK
    needs: [lint, test-backend, test-frontend, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Promueve el código de dev a test
      - name: Push to test
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git push origin HEAD:test
      # Dispara el pipeline en test para validación final con SonarCloud
      - name: Trigger CI on test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci-pr.yml --ref test
      - name: Notify sync to test
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ env.TELEGRAM_PREFIX }}
            ─────────────────────
            🔄 *Sync: dev → test*
            Código promovido de \`dev\` a \`test\`
            Se disparó CI en \`test\` para validación final.
            📌 Pendiente: SonarCloud + Auto-merge a main

  # ── Job 7: Auto-merge test → main + Deploy a Render ────────────────────
  auto-merge:
    if: success() && github.ref_name == 'test'   # Solo en test y si todo OK
    needs: [lint, test-backend, test-frontend, sonarcloud, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Promueve el código de test a main (producción)
      - name: Push test → main
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git push origin HEAD:main
      # Despliega en Render vía API
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -s -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json"
      - name: Notify auto-merge and deploy
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ env.TELEGRAM_PREFIX }}
            ─────────────────────
            🚀 *Auto-merge + Deploy exitoso*
            📦 \`test\` → \`main\` mergeado
            🌐 Desplegando en Render...
            📌 Siguiente: Notificación de deploy

  # ── Job 8: Notificación de éxito ─────────────────────────────────────────
  notify-success:
    if: success()
    needs: [lint, test-backend, test-frontend, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ env.TELEGRAM_PREFIX }}
            ─────────────────────
            ${{ github.ref_name == 'dev'
            && '🟢 *Pipeline Dev completado exitosamente*
            ✅ Lint · ✅ Tests Backend · ✅ Tests Frontend · ✅ CodeQL
            🔄 Sincronizando a \`test\`...'
            || '🟢 *Pipeline Test completado exitosamente*
            ✅ Lint · ✅ Tests Backend · ✅ Tests Frontend · ✅ SonarCloud · ✅ CodeQL
            🚀 Mergeando a \`main\` + Desplegando en Render...' }}

  # ── Job 9: Notificación de fallo ─────────────────────────────────────────
  notify-failure:
    if: failure()
    needs: [lint, test-backend, test-frontend, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ *Pipeline Bloqueado — ${{ github.repository }}*
            🌿 Rama: \`${{ github.ref_name }}\`
            👤 Autor: ${{ github.actor }}
            ─────────────────────
            🔴 El pipeline se detuvo en \`${{ github.ref_name }}\`
            🚫 No se sincroniza a la siguiente fase.
            ─────────────────────
            ⚠️ *Posibles causas:*
            • Error de lint en backend o frontend
            • Tests fallidos
            • CodeQL detectó vulnerabilidades
            ─────────────────────
            👨‍💻 Revisa los logs y corrige antes de reintentar.
            🔗 [Ver workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  # ── Job 10: Notificación de cancelación ──────────────────────────────────
  notify-blocked:
    if: cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ⏹ *Pipeline cancelado — ${{ github.repository }}*
            🌿 Rama: \`${{ github.ref_name }}\`
            👤 Autor: ${{ github.actor }}
            El pipeline fue cancelado manualmente.
